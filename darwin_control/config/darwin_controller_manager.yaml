controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller_general:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - neck_joint
      - r_hip_joint
      - r_thigh_joint
      - r_knee_joint
      - r_ankle_joint
      - r_foot_joint
      - r_shoulder_joint
      - r_biceps_joint
      - r_elbow_joint
      - l_hip_joint
      - l_thigh_joint
      - l_knee_joint
      - l_ankle_joint
      - l_foot_joint
      - l_shoulder_joint
      - l_biceps_joint
      - l_elbow_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 1.0 # Defaults to 20

    allow_partial_joints_goal: true
    interpolate_from_desired_state: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)
